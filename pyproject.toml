[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "binauralbuilder"
version = "0.1.0"
description = "Binaural session editor with a SAM/HRTF spatial-audio workbench"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
keywords = ["binaural", "spatial audio", "HRTF", "SOFA", "psychoacoustics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Multimedia :: Sound/Audio :: Editors",
]

# The application depends on PyQt5, which is GPL v3; see
# docs/dependency_licenses.md before distributing a binary. The canonical
# workbench core carries no Qt dependency and is importable on its own.
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "soundfile",
    "h5py>=3.11",
]

[project.optional-dependencies]
gui = [
    "pyqt5==5.15.11",
    "matplotlib",
    "pandas",
    "plotly>=5.20",
]
audio = [
    "librosa==0.11.0",
    "numba",
]
# Standards verification and the advanced HRTF import routes.
hrtf = [
    "sofar>=1.1.3",
    "pyfar>=0.7",
]
# The legacy slab-based SAM path, kept available but not developed further.
legacy = ["slab==1.8.0"]
test = [
    "pytest>=8",
    "pytest-qt>=4",
]

[project.scripts]
sam-workbench = "src.audio.sam_workbench.cli:main"
sam-benchmark = "src.audio.sam_workbench.benchmark:main"

[tool.setuptools]
# The repository is laid out as a package tree under `src/` plus a top-level
# entry point, rather than as a src-layout distribution; list what ships.
packages = [
    "src",
    "src.audio",
    "src.audio.sam_workbench",
    "src.audio.sam_workbench.analysis",
    "src.audio.sam_workbench.dsp",
    "src.audio.sam_workbench.experiment",
    "src.audio.sam_workbench.hrtf",
    "src.audio.sam_workbench.render",
    "src.audio.sam_workbench.trajectory",
    "src.synth_functions",
    "src.ui",
    "src.utils",
]

[tool.setuptools.package-data]
"src.audio.sam_workbench" = ["*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
# GUI tests need a platform plugin that does not require a display. Set it in
# the environment rather than here: pytest-env is not a dependency, and an ini
# key no plugin claims is only a warning, which would make it look configured
# while doing nothing.
#   QT_QPA_PLATFORM=offscreen python -m pytest
